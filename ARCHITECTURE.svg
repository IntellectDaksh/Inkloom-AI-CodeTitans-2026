<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #111111; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #666666; }
      .box { fill: #F8F9FA; stroke: #D1D5DB; stroke-width: 1.5; rx: 8px; }
      .box-active { fill: #FFFFFF; stroke: #087F5B; stroke-width: 2; rx: 8px; }
      .box-highlight { fill: #E6FCF5; stroke: #087F5B; stroke-width: 1.5; rx: 8px; }
      .box-dark { fill: #111111; stroke: #111111; rx: 8px; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10px; font-weight: 700; fill: #087F5B; letter-spacing: 0.5px; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #4B5563; line-height: 1.4; }
      .arrow { stroke: #9CA3AF; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #087F5B; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-green); }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 600; fill: #087F5B; }
      .lane-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; fill: #6B7280; letter-spacing: 1px; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#087F5B" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" class="bg" />
  <rect x="15" y="15" width="1170" height="650" fill="none" stroke="#E5E7EB" stroke-width="1" rx="12" />

  <!-- Diagram Header -->
  <text x="40" y="52" class="title">Inkloom AI — End-to-End Governance Architecture</text>
  <text x="40" y="72" class="subtitle">Deterministic Pre-Flight Verification &amp; Evidence-Grounded LLM Reasoning Lifecycle</text>

  <!-- Horizontal Lanes Boundary -->
  <line x1="40" y1="90" x2="1160" y2="90" stroke="#E5E7EB" stroke-width="1" />

  <!-- ================= TOP PIPELINE: STAGES 1 TO 4 ================= -->
  <!-- Stage 1 -->
  <g transform="translate(40, 110)">
    <rect width="250" height="110" class="box" />
    <text x="16" y="24" class="stage-num">STAGE 01</text>
    <text x="16" y="44" class="box-title">Ingestion &amp; Segmentation</text>
    <text x="16" y="64" class="box-desc">• Semantic paragraph segmentation</text>
    <text x="16" y="80" class="box-desc">• Candidate metric &amp; timeframe extraction</text>
    <text x="16" y="96" class="box-desc">• Channel context tag (Social, PDP, Ad)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 290 165 L 325 165" class="arrow" />

  <!-- Stage 2 -->
  <g transform="translate(330, 110)">
    <rect width="250" height="110" class="box-highlight" />
    <text x="16" y="24" class="stage-num">STAGE 02 · DETERMINISTIC (&lt;5ms)</text>
    <text x="16" y="44" class="box-title">Rule Pre-Flight Scanner</text>
    <text x="16" y="64" class="box-desc">• Prohibited superlatives ("miracle", "100%")</text>
    <text x="16" y="80" class="box-desc">• Statutory tags (FTC #ad, FDA DSHEA)</text>
    <text x="16" y="96" class="box-desc">• Prunes obvious breaches before LLM call</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 580 165 L 615 165" class="arrow" />

  <!-- Stage 3 -->
  <g transform="translate(620, 110)">
    <rect width="250" height="110" class="box" />
    <text x="16" y="24" class="stage-num">STAGE 03 · RLS ISOLATED</text>
    <text x="16" y="44" class="box-title">Scoped Knowledge Retrieval</text>
    <text x="16" y="64" class="box-desc">• Multi-tenant partition by brand_id</text>
    <text x="16" y="80" class="box-desc">• Approved claims, DOIs &amp; ISO assays</text>
    <text x="16" y="96" class="box-desc">• pgvector semantic similarity match</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 870 165 L 905 165" class="arrow" />

  <!-- Stage 4 -->
  <g transform="translate(910, 110)">
    <rect width="250" height="110" class="box-active" />
    <text x="16" y="24" class="stage-num">STAGE 04 · GEMINI FLASH</text>
    <text x="16" y="44" class="box-title">Contextual AI Analysis</text>
    <text x="16" y="64" class="box-desc">• Grounded prompt with retrieved evidence</text>
    <text x="16" y="80" class="box-desc">• Zero-hallucination guardrail constraint</text>
    <text x="16" y="96" class="box-desc">• Deterministic offline fallback engine</text>
  </g>

  <!-- Mid-pipeline Connector: Stage 4 down to Stage 5 -->
  <path d="M 1035 220 L 1035 255 L 165 255 L 165 290" class="arrow-green" />

  <!-- ================= BOTTOM PIPELINE: STAGES 5 TO 8 ================= -->
  <!-- Stage 5 -->
  <g transform="translate(40, 290)">
    <rect width="250" height="110" class="box" />
    <text x="16" y="24" class="stage-num">STAGE 05</text>
    <text x="16" y="44" class="box-title">Findings &amp; Provenance Linking</text>
    <text x="16" y="64" class="box-desc">• Character offset risk token mapping</text>
    <text x="16" y="80" class="box-desc">• Links findings to clinical trial DOIs</text>
    <text x="16" y="96" class="box-desc">• Unverified claims marked isVerified: false</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 290 345 L 325 345" class="arrow" />

  <!-- Stage 6 -->
  <g transform="translate(330, 290)">
    <rect width="250" height="110" class="box-highlight" />
    <text x="16" y="24" class="stage-num">STAGE 06</text>
    <text x="16" y="44" class="box-title">Scoring &amp; Surgical Diffing</text>
    <text x="16" y="64" class="box-desc">• Multi-factor score (0–100 scale)</text>
    <text x="16" y="80" class="box-desc">• Token-level inline redline diff</text>
    <text x="16" y="96" class="box-desc">• 1-click "Apply Surgical Fix" trigger</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <path d="M 580 345 L 615 345" class="arrow" />

  <!-- Stage 7 -->
  <g transform="translate(620, 290)">
    <rect width="250" height="110" class="box-active" />
    <text x="16" y="24" class="stage-num">STAGE 07 · HUMAN IN THE LOOP</text>
    <text x="16" y="44" class="box-title">Approval Gate &amp; Overrides</text>
    <text x="16" y="64" class="box-desc">• Creator disputes with counter-evidence</text>
    <text x="16" y="80" class="box-desc">• Reasoned dismissal with justification</text>
    <text x="16" y="96" class="box-desc">• Reviewer overrides with signature log</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <path d="M 870 345 L 905 345" class="arrow-green" />

  <!-- Stage 8 -->
  <g transform="translate(910, 290)">
    <rect width="250" height="110" class="box-highlight" />
    <text x="16" y="24" class="stage-num">STAGE 08 · AUDIT &amp; CASCADE</text>
    <text x="16" y="44" class="box-title">Ledger &amp; Cascade Engine</text>
    <text x="16" y="64" class="box-desc">• Immutable SHA-256 audit_events</text>
    <text x="16" y="80" class="box-desc">• Monitors claims expiring in &lt;30 days</text>
    <text x="16" y="96" class="box-desc">• Cascade re-review flags historical drafts</text>
  </g>

  <!-- ================= LOWER ARCHITECTURAL TIERS ================= -->
  <line x1="40" y1="425" x2="1160" y2="425" stroke="#E5E7EB" stroke-width="1" />

  <text x="40" y="450" class="lane-title">FOUNDATIONAL INFRASTRUCTURE &amp; DATA ISOLATION TIERS</text>

  <!-- Tier 1: Client & Serverless Runtime -->
  <g transform="translate(40, 465)">
    <rect width="355" height="175" class="box" />
    <text x="20" y="30" class="box-title">Frontend &amp; Edge Runtime</text>
    <text x="20" y="55" class="box-desc">Next.js 16 App Router · React 19 · TypeScript</text>
    <text x="20" y="75" class="box-desc">Tailwind CSS v4 Swiss Minimalist Design System</text>
    <text x="20" y="95" class="box-desc">Vercel Serverless Edge API Routes</text>
    <text x="20" y="115" class="box-desc">Turbopack Sub-second Production Builds</text>
    <text x="20" y="135" class="box-desc">Zero Dead-Link Policy (29 Functional Routes)</text>
    <text x="20" y="155" class="box-desc">Deterministic Pre-Flight Scanner (&lt;5ms)</text>
  </g>

  <!-- Tier 2: AI & Retrieval Engine -->
  <g transform="translate(422, 465)">
    <rect width="355" height="175" class="box" />
    <text x="20" y="30" class="box-title">AI &amp; Governance Verification</text>
    <text x="20" y="55" class="box-desc">Google Gemini 2.5 Flash / 3.5 Flash-Lite REST</text>
    <text x="20" y="75" class="box-desc">Strict JSON Schema Output Enforcement</text>
    <text x="20" y="95" class="box-desc">Algorithmic Zero-Hallucination Guardrails</text>
    <text x="20" y="115" class="box-desc">Clinical DOI &amp; ISO 22196 Assay Grounding</text>
    <text x="20" y="135" class="box-desc">Offline Deterministic Fallback Analyzer</text>
    <text x="20" y="155" class="box-desc">Word-Level Surgical Redline Token Diffing</text>
  </g>

  <!-- Tier 3: Dual-Tier Persistence -->
  <g transform="translate(805, 465)">
    <rect width="355" height="175" class="box" />
    <text x="20" y="30" class="box-title">Dual-Tier Persistence &amp; RLS</text>
    <text x="20" y="55" class="box-desc">Tier 1: 25-Table PostgreSQL Schema with RLS</text>
    <text x="20" y="75" class="box-desc">Tier 2: Embedded JSON Store (InkloomStore)</text>
    <text x="20" y="95" class="box-desc">Strict Cross-Tenant &amp; Cross-Brand Barriers</text>
    <text x="20" y="115" class="box-desc">pgvector Semantic Embeddings (1536 dim)</text>
    <text x="20" y="135" class="box-desc">SHA-256 Tamper-Evident Audit Event Trail</text>
    <text x="20" y="155" class="box-desc">58/58 Automated Test Assertions Passing</text>
  </g>

</svg>
